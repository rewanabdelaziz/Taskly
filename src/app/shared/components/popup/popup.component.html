@if (_popUp.isOpen() && _popUp.activePopUp(); as popupConfig) {
  <div 
    class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"
    (click)="_popUp.close()">
    
    <div (click)="$event.stopPropagation()">
      <ng-container 
        *ngComponentOutlet="popupConfig.component; inputs: popupConfig.inputs">
      </ng-container>
    </div>

  </div>
}
